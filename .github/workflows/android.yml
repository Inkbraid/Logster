# Android build pipeline.
#
# Builds the app, runs the unit tests and publishes the APKs as workflow
# artifacts on every push and pull request. It can also be started by hand
# from the Actions tab ("Run workflow").
#
# Artifacts attached to each run:
#   gpslogger-<version>-debug    installable debug APK (com.mendhak.gpslogger.debug)
#   gpslogger-<version>-release  release APK: signed when the signing secrets
#                                below are configured, otherwise unsigned
#   unit-test-report             JUnit XML and HTML reports
#
# Optional repository secrets for signed release builds (the same ones the
# tag-triggered generate-release-apk.yml release workflow uses):
#   KEYSTORE                base64-encoded .jks keystore
#   SIGNING_STORE_PASSWORD  keystore password
#   SIGNING_KEY_ALIAS       key alias inside the keystore
#   SIGNING_KEY_PASSWORD    key password
# When KEYSTORE is not set the release APK is built unsigned.

name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only keep the newest run per branch / pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A push to a branch of this repository already triggers a run, so skip the
    # duplicate pull_request run for pull requests that come from this
    # repository. Pull requests from forks still get their own run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle dependencies and wrapper distributions between runs, and
      # checks gradle-wrapper.jar against the published checksums.
      # Kept on v5: starting with v6 the caching part of gradle/actions is a
      # separate proprietary component with its own terms of use.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true

      - name: Read app version
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' gpslogger/build.gradle | head -n 1)
          echo "Building GPSLogger version ${VERSION_NAME}"
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build debug and release APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Signing secrets found: the release APK will be signed."
            mkdir -p gpslogger/keystore
            echo "$KEYSTORE_BASE64" | base64 --decode > gpslogger/keystore/your_signing_keystore.jks
          else
            echo "No KEYSTORE secret configured: the release APK will be unsigned."
            # gpslogger/build.gradle enables release signing whenever
            # SIGNING_STORE_PASSWORD is set, so make sure it is not.
            unset KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD
          fi
          ./gradlew assembleDebug assembleRelease --no-configuration-cache

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: gpslogger-${{ steps.version.outputs.name }}-debug
          path: gpslogger/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: gpslogger-${{ steps.version.outputs.name }}-release
          path: gpslogger/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-configuration-cache

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: |
            gpslogger/build/reports/tests/testDebugUnitTest/
            gpslogger/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
